<title>Sequencer &amp; Instruction Cycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the sequencer (driven by the clock and the microcode) sits at the centre, wired to
   four units -- instruction pointer, instruction register, decoder, execution -- which are
   themselves connected to memory through the three buses; a step-by-step mode animates one
   full instruction cycle. */
:root{
  --bg:#f3f1ec;
  --surface:#ffffff;
  --ink:#1c1a17;
  --ink-muted:#6b665d;
  --border:#d8d2c4;
  --ctrl-tint:#eef0f6;
  --ctrl-line:#7e8fc0;
  --path-tint:#eef1ea;
  --path-line:#8fa583;
  --mem-tint:#f7efe4;
  --mem-line:#c9a266;
  --addr:#b8752f;
  --data:#3763b0;
  --cmd:#7a4fb0;
  --active:#c23b3b;
  --active-glow:rgba(194,59,59,.28);
  --chip-bg:#e7e2d5;
  --chip-fg:#6b665d;
  --chip-active-bg:#c23b3b;
  --chip-active-fg:#fff7f0;
  --font-ui:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191712; --surface:#242019; --ink:#f1ece1; --ink-muted:#a89f8d; --border:#3c362a;
    --ctrl-tint:#1c2130; --ctrl-line:#8b9bd1; --path-tint:#212a1d; --path-line:#7f9873;
    --mem-tint:#2a2419; --mem-line:#c9a266;
    --addr:#d99446; --data:#7fa4ea; --cmd:#b28ee0;
    --active:#e2635b; --active-glow:rgba(226,99,91,.35);
    --chip-bg:#332c20; --chip-fg:#a89f8d; --chip-active-bg:#e2635b; --chip-active-fg:#231411;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191712; --surface:#242019; --ink:#f1ece1; --ink-muted:#a89f8d; --border:#3c362a;
  --ctrl-tint:#1c2130; --ctrl-line:#8b9bd1; --path-tint:#212a1d; --path-line:#7f9873;
  --mem-tint:#2a2419; --mem-line:#c9a266;
  --addr:#d99446; --data:#7fa4ea; --cmd:#b28ee0;
  --active:#e2635b; --active-glow:rgba(226,99,91,.35);
  --chip-bg:#332c20; --chip-fg:#a89f8d; --chip-active-bg:#e2635b; --chip-active-fg:#231411;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);margin:0}
.app{max-width:1180px;margin:0 auto;padding:28px 20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-size:clamp(1.3rem,2.6vw,1.7rem);margin:0;font-weight:700;letter-spacing:-.01em}
.subtitle{margin:0;color:var(--ink-muted);font-size:.95rem}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font-family:var(--font-ui);font-size:.85rem;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--active);color:var(--active)}
button:focus-visible{outline:2px solid var(--active);outline-offset:2px}
#btnPlay{background:var(--active);color:#fff7f0;border-color:var(--active)}
#btnPlay:hover{opacity:.9;color:#fff7f0}
.speed-wrap{display:flex;align-items:center;gap:8px;color:var(--ink-muted);font-size:.82rem;margin-left:auto}
input[type="range"]{accent-color:var(--active)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.addr{background:var(--addr)}
.dot.data{background:var(--data)}
.dot.cmd{background:var(--cmd)}
.dot.act{background:var(--active)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.03em;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--chip-bg);color:var(--chip-fg);transition:background .25s,color .25s,transform .25s}
.chip.on{background:var(--chip-active-bg);color:var(--chip-active-fg);transform:translateY(-1px)}

.stage-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px}
svg#diagram{display:block;min-width:860px;width:100%;height:auto}

.blk{fill:var(--surface);stroke:var(--border);stroke-width:1.4;transition:stroke .25s,fill .25s,filter .25s}
.blk.active{stroke:var(--active);stroke-width:2.2;filter:drop-shadow(0 0 6px var(--active-glow))}
.blk.ctrl{fill:var(--ctrl-tint)}
.blk.mem{fill:var(--mem-tint)}
.lbl-block{font-family:var(--font-ui);font-weight:700;font-size:12.5px}
.t-main{font-family:var(--font-ui);font-weight:600;font-size:13px;fill:var(--ink)}
.t-sub{font-family:var(--font-mono);font-size:10.5px;fill:var(--ink-muted)}
.wire{fill:none;stroke:var(--border);stroke-width:1.6}
.wire-addr{stroke:var(--addr)}
.wire-data{stroke:var(--data)}
.wire-cmd{stroke:var(--cmd);stroke-dasharray:5 4}
.wire-link{stroke:var(--ctrl-line);stroke-width:1.8}
.bus-lbl{font-family:var(--font-mono);font-size:10px;fill:var(--ink-muted)}
.memrow{fill:var(--mem-tint);stroke:var(--border);stroke-width:1;transition:fill .25s,stroke .25s}
.memrow.active{stroke:var(--active);stroke-width:2;filter:drop-shadow(0 0 6px var(--active-glow))}
.mem-addr{font-family:var(--font-mono);font-size:10.5px;fill:var(--ink-muted)}
.mem-val{font-family:var(--font-mono);font-size:11px;font-weight:600;fill:var(--ink)}
.packet{fill:var(--addr);filter:drop-shadow(0 1px 3px rgba(0,0,0,.35));opacity:0}
.packet.data{fill:var(--data)}
.packet.cmd{fill:var(--cmd)}
.packet-lbl{font-family:var(--font-mono);font-size:10px;font-weight:600;text-anchor:middle;opacity:0}
.packet.on,.packet-lbl.on{opacity:1}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.panel h2{margin:0;font-size:1.05rem}
.panel p{margin:0;color:var(--ink-muted);line-height:1.55;font-size:.95rem}

.scrubber{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sdot{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);font-family:var(--font-mono);font-size:.78rem;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sdot.on{background:var(--active);border-color:var(--active);color:#fff7f0}
.sdot:hover{border-color:var(--active);color:var(--active)}
.sdot.on:hover{color:#fff7f0}

@media (prefers-reduced-motion: reduce){ .blk,.memrow,.chip{transition:none} }
</style>

<div class="app">
  <header>
    <h1>The sequencer and the instruction cycle</h1>
    <p class="subtitle">How the clock, the sequencer and the microcode orchestrate fetching, decoding and executing an instruction</p>
  </header>

  <div class="toolbar">
    <div class="controls">
      <button id="btnPlay" type="button">▶ Play</button>
      <button id="btnPrev" type="button" aria-label="Previous step">◀</button>
      <button id="btnNext" type="button" aria-label="Next step">▶</button>
      <button id="btnReset" type="button" aria-label="Restart">↺ Restart</button>
    </div>
    <div class="speed-wrap">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0.6" max="2" step="0.2" value="1">
    </div>
  </div>

  <div class="legend">
    <span><i class="dot addr"></i> Address bus</span>
    <span><i class="dot data"></i> Data bus</span>
    <span><i class="dot cmd"></i> Control bus</span>
    <span><i class="dot act"></i> Active element</span>
  </div>

  <div class="chips" id="chips"></div>

  <div class="stage-wrap">
    <svg id="diagram" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the sequencer driving the instruction pointer, instruction register, decoder and execution unit, connected to memory through the address, data and control buses">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" style="fill:var(--border)"/>
        </marker>
        <marker id="arrowAddr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" style="fill:var(--addr)"/>
        </marker>
        <marker id="arrowData" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" style="fill:var(--data)"/>
        </marker>
        <marker id="arrowCmd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" style="fill:var(--cmd)"/>
        </marker>
        <marker id="arrowLink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" style="fill:var(--ctrl-line)"/>
        </marker>
        <marker id="arrowRev" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse">
          <path d="M0,0 L6,3 L0,6 Z" style="fill:var(--border)"/>
        </marker>
      </defs>

      <!-- Control column -->
      <rect id="clock" class="blk ctrl" x="40" y="40" width="180" height="70" rx="8"/>
      <text class="t-main" x="130" y="80" text-anchor="middle">Clock</text>

      <rect id="sequencer" class="blk ctrl" x="40" y="150" width="180" height="280" rx="10"/>
      <text class="lbl-block" x="130" y="175" text-anchor="middle" style="fill:var(--ctrl-line)">SEQUENCER</text>
      <text class="t-sub" x="130" y="290" text-anchor="middle">ensures the correct</text>
      <text class="t-sub" x="130" y="304" text-anchor="middle">sequencing of</text>
      <text class="t-sub" x="130" y="318" text-anchor="middle">operations</text>

      <rect id="microcode" class="blk ctrl" x="40" y="470" width="180" height="70" rx="8"/>
      <text class="t-main" x="130" y="500" text-anchor="middle">Microcode</text>
      <text class="t-sub" x="130" y="516" text-anchor="middle">(control memory)</text>

      <!-- Units column -->
      <rect id="ip" class="blk" x="330" y="55" width="220" height="70" rx="8"/>
      <text class="t-main" x="440" y="83" text-anchor="middle">Instruction pointer</text>
      <text class="t-sub" x="440" y="100" text-anchor="middle">address of the next instruction</text>

      <rect id="ir" class="blk" x="330" y="220" width="220" height="70" rx="8"/>
      <text class="t-main" x="440" y="248" text-anchor="middle">Instruction register</text>
      <text class="t-sub" x="440" y="265" text-anchor="middle">receives the byte read from memory</text>

      <rect id="decoder" class="blk" x="330" y="335" width="220" height="70" rx="8"/>
      <text class="t-main" x="440" y="363" text-anchor="middle">Decoder</text>
      <text class="t-sub" x="440" y="380" text-anchor="middle">interprets the instruction</text>

      <rect id="execution" class="blk" x="330" y="450" width="220" height="70" rx="8"/>
      <text class="t-main" x="440" y="478" text-anchor="middle">Execution</text>
      <text class="t-sub" x="440" y="495" text-anchor="middle">the operation is carried out</text>

      <!-- Memory -->
      <rect id="memory-block" class="blk mem" x="660" y="40" width="240" height="500" rx="14"/>
      <text class="lbl-block" x="780" y="66" text-anchor="middle" style="fill:var(--mem-line)">MEMORY</text>
      <g id="memrows"></g>

      <!-- Control wires -->
      <line class="wire" x1="130" y1="110" x2="130" y2="150" marker-end="url(#arrow)"/>
      <path class="wire" d="M220,200 L280,200 L280,90 L330,90" marker-end="url(#arrow)"/>
      <line class="wire" x1="220" y1="255" x2="330" y2="255" marker-end="url(#arrow)"/>
      <line class="wire" x1="330" y1="255" x2="220" y2="255" marker-end="url(#arrow)" transform="translate(0,10)"/>
      <path id="seqDecoderLink" class="wire" d="M220,340 L280,340 L280,368 L330,368" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
      <line class="wire" x1="440" y1="290" x2="440" y2="335" marker-end="url(#arrow)"/>
      <path class="wire" d="M220,400 L280,400 L280,483 L330,483" marker-end="url(#arrow)"/>
      <line class="wire" x1="440" y1="405" x2="440" y2="450" marker-end="url(#arrow)"/>
      <line class="wire" x1="130" y1="470" x2="130" y2="430" marker-end="url(#arrow)"/>
      <line class="wire" x1="118" y1="430" x2="118" y2="470" marker-end="url(#arrow)"/>

      <!-- External buses -->
      <path id="addrPath" class="wire wire-addr" d="M550,90 L660,90" marker-end="url(#arrowAddr)" style="opacity:.55"/>
      <text class="bus-lbl" x="605" y="80" text-anchor="middle" style="fill:var(--addr)">address bus</text>

      <path id="cmdPath" class="wire wire-cmd" d="M220,220 L610,220 L610,180 L660,180" marker-end="url(#arrowCmd)" style="opacity:.55"/>
      <text class="bus-lbl" x="440" y="212" text-anchor="middle" style="fill:var(--cmd)">control bus: “read memory”</text>

      <path id="dataPath" class="wire wire-data" d="M660,300 L550,255" marker-end="url(#arrowData)" style="opacity:.55"/>
      <text class="bus-lbl" x="605" y="330" text-anchor="middle" style="fill:var(--data)">data bus</text>

      <!-- Return loop -->
      <path id="loopPath" class="wire" d="M550,483 L1000,483 L1000,20 L130,20 L130,40" style="stroke-dasharray:4 4;opacity:.4" marker-end="url(#arrow)"/>
      <text class="bus-lbl" x="1000" y="34" text-anchor="middle">next instruction</text>

      <circle id="packet" class="packet" r="8"/>
      <text id="packetLabel" class="packet-lbl"></text>
    </svg>
  </div>

  <div class="panel">
    <h2 id="stepTitle">—</h2>
    <p id="stepDesc">—</p>
  </div>

  <div class="scrubber" id="scrubber"></div>
</div>

<script>
(function(){
  "use strict";
  var svgNS = "http://www.w3.org/2000/svg";
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function $(id){ return document.getElementById(id); }

  var memRowsG = $('memrows');
  var rows = [
    {addr:'2FFCH', val:'··'},
    {addr:'2FFEH', val:'··'},
    {addr:'3000H', val:'B8H'},
    {addr:'3001H', val:'12H'},
    {addr:'3002H', val:'34H'},
    {addr:'3004H', val:'··'}
  ];
  var memRows = [];
  rows.forEach(function(r,i){
    var y = 105 + i*72;
    var rect = document.createElementNS(svgNS,'rect');
    rect.setAttribute('class','memrow'); rect.setAttribute('x',675); rect.setAttribute('y',y);
    rect.setAttribute('width',210); rect.setAttribute('height',60); rect.setAttribute('rx',6);
    var a = document.createElementNS(svgNS,'text');
    a.setAttribute('class','mem-addr'); a.setAttribute('x',686); a.setAttribute('y',y+36); a.textContent = r.addr;
    var v = document.createElementNS(svgNS,'text');
    v.setAttribute('class','mem-val'); v.setAttribute('x',874); v.setAttribute('y',y+36); v.setAttribute('text-anchor','end'); v.textContent = r.val;
    memRowsG.appendChild(rect); memRowsG.appendChild(a); memRowsG.appendChild(v);
    memRows.push(rect);
  });
  var memTarget = memRows[2];

  var allBlocks = ['clock','sequencer','microcode','ip','ir','decoder','execution'];
  var phases = ['CLOCK','ADDRESSING','READ','DECODE','MICROCODE','EXECUTE'];
  var packet = $('packet'), packetLabel = $('packetLabel');
  var seqDecoderLink = $('seqDecoderLink');

  var steps = [
    { phase:[], title:"Idle state",
      desc:"The sequencer waits for the next clock edge to start a new instruction cycle. The instruction pointer already holds the address of the instruction to be read.",
      hi:['sequencer','ip'] },

    { phase:['CLOCK'], title:"The clock paces the sequencer",
      desc:"A clock edge triggers the sequencer. Step by step, it will activate the right units at the right time: instruction pointer, instruction register, decoder, then execution.",
      hi:['clock','sequencer'] },

    { phase:['ADDRESSING'], title:"The sequencer activates the instruction pointer",
      desc:"The sequencer allows the instruction pointer to place its content on the address bus.",
      hi:['sequencer','ip'] },

    { phase:['ADDRESSING'], title:"Address sent to memory",
      desc:"The address held in the instruction pointer is transmitted to memory on the address bus: it designates the memory location to be read.",
      hi:['ip','memory-target'], packet:{path:'addrPath', kind:'addr', label:'3000H'} },

    { phase:['READ'], title:"“Read memory” command",
      desc:"At the same time, the sequencer sends the “read memory” order on the control bus, which authorizes memory to respond.",
      hi:['sequencer','memory-target'], packet:{path:'cmdPath', kind:'cmd', label:'read'} },

    { phase:['READ'], title:"The instruction comes back on the data bus",
      desc:"Memory places the requested byte (B8H) on the data bus. It is captured by the instruction register.",
      hi:['memory-target','ir'], packet:{path:'dataPath', kind:'data', label:'B8H'} },

    { phase:['DECODE'], title:"Handed over to the decoder",
      desc:"The sequencer passes the content of the instruction register to the decoder, whose job is to extract the operation to perform and its operands.",
      hi:['ir','decoder'] },

    { phase:['MICROCODE'], title:"Consulting the microcode",
      desc:"For complex instructions, the decoder (driven by the sequencer) consults the microcode memory: each instruction is associated there with a small sequence of hard-wired micro-operations, detailing step by step how to carry it out. The sequencer and the decoder stay linked throughout — the decoder keeps reporting what it finds, and the sequencer keeps pacing what happens next.",
      hi:['sequencer','microcode','decoder'], link:true },

    { phase:['EXECUTE'], title:"The sequencer triggers execution",
      desc:"The sequencer activates the execution stage: the registers and the ALU will now actually perform the requested operation.",
      hi:['sequencer','execution'] },

    { phase:['EXECUTE'], title:"The decoder drives execution",
      desc:"The control signals produced by the decoder are applied to the execution stage, which carries out the operation with the intended operands.",
      hi:['decoder','execution'], link:true },

    { phase:['CLOCK'], title:"Back to the sequencer: next cycle",
      desc:"Once execution is complete, the instruction pointer is incremented and the sequencer returns to its initial state, ready to repeat the whole cycle for the next instruction.",
      hi:['execution','sequencer','ip'], loop:true }
  ];

  var chipsWrap = $('chips'), chipEls = {};
  phases.forEach(function(p){ var c=document.createElement('span'); c.className='chip'; c.textContent=p; chipsWrap.appendChild(c); chipEls[p]=c; });

  var scrubber = $('scrubber'), dots = [];
  steps.forEach(function(s,i){
    var b = document.createElement('button'); b.type='button'; b.className='sdot'; b.textContent=(i+1);
    b.setAttribute('aria-label','Step '+(i+1)+': '+s.title);
    b.addEventListener('click', function(){ pause(); goTo(i); });
    scrubber.appendChild(b); dots.push(b);
  });

  function animatePacket(pathId, kind, label, duration, onDone){
    var path = $(pathId);
    if (!path){ if(onDone) onDone(); return; }
    var len = path.getTotalLength();
    packet.setAttribute('class','packet'+(kind!=='addr'?' '+kind:'')+' on');
    packetLabel.setAttribute('class','packet-lbl on');
    packetLabel.textContent = label || '';
    if (reduceMotion){
      var end = path.getPointAtLength(len);
      packet.setAttribute('cx',end.x); packet.setAttribute('cy',end.y);
      packetLabel.setAttribute('x',end.x); packetLabel.setAttribute('y',end.y-14);
      if (onDone) onDone(); return;
    }
    var start=null;
    function frame(ts){
      if(!start) start=ts;
      var t=Math.min(1,(ts-start)/duration);
      var p=path.getPointAtLength(t*len);
      packet.setAttribute('cx',p.x); packet.setAttribute('cy',p.y);
      packetLabel.setAttribute('x',p.x); packetLabel.setAttribute('y',p.y-14);
      if(t<1){ requestAnimationFrame(frame); } else if(onDone){ onDone(); }
    }
    requestAnimationFrame(frame);
  }
  function hidePacket(){ packet.setAttribute('class','packet'); packetLabel.setAttribute('class','packet-lbl'); }

  var current = 0;
  function baseDuration(){ return 2600/parseFloat(speed.value); }
  var loopPath = $('loopPath');

  function render(i, animate){
    var s = steps[i];
    allBlocks.forEach(function(id){ var el=$(id); if(el) el.classList.remove('active'); });
    (s.hi||[]).forEach(function(id){ var el=$(id); if(el) el.classList.add('active'); });
    memTarget.classList.toggle('active', (s.hi||[]).indexOf('memory-target')!==-1);
    phases.forEach(function(p){ chipEls[p].classList.toggle('on', s.phase.indexOf(p)!==-1); });
    loopPath.style.opacity = s.loop ? '.9' : '.4';
    loopPath.style.stroke = s.loop ? 'var(--active)' : 'var(--border)';
    seqDecoderLink.style.opacity = s.link ? '1' : '.45';
    seqDecoderLink.style.strokeWidth = s.link ? '2.6' : '1.8';

    $('stepTitle').textContent = (i+1)+'. '+s.title;
    $('stepDesc').textContent = s.desc;
    dots.forEach(function(d,idx){ d.classList.toggle('on', idx===i); });

    hidePacket();
    if (animate && s.packet){
      animatePacket(s.packet.path, s.packet.kind, s.packet.label, baseDuration()*0.6, hidePacket);
    }
  }
  function goTo(i, animate){ current=((i%steps.length)+steps.length)%steps.length; render(current, animate!==false); }

  var playing=false, timer=null, btnPlay=$('btnPlay');
  function scheduleNext(){
    timer=setTimeout(function(){
      var next = current===steps.length-1 ? 1 : current+1;
      goTo(next, true);
      if (playing) scheduleNext();
    }, baseDuration());
  }
  function play(){ if(playing) return; playing=true; btnPlay.textContent='⏸ Pause'; scheduleNext(); }
  function pause(){ playing=false; btnPlay.textContent='▶ Play'; if(timer) clearTimeout(timer); }

  btnPlay.addEventListener('click', function(){ playing?pause():play(); });
  $('btnPrev').addEventListener('click', function(){ pause(); goTo(current-1); });
  $('btnNext').addEventListener('click', function(){ pause(); goTo(current===steps.length-1?1:current+1); });
  $('btnReset').addEventListener('click', function(){ pause(); goTo(0); });
  var speed = $('speed');

  window.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'){ pause(); goTo(current===steps.length-1?1:current+1); }
    else if(e.key==='ArrowLeft'){ pause(); goTo(current-1); }
    else if(e.key===' '){ e.preventDefault(); playing?pause():play(); }
  });

  goTo(0,false);
})();
</script>
